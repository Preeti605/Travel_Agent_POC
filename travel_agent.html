<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trip planner</title>
<style>
  :root {
    --ink: #1c1b19;
    --muted: #6b6a63;
    --paper: #faf8f4;
    --card: #ffffff;
    --line: #e4e1d8;
    --accent: #2f6f5e;
    --accent-ink: #ffffff;
    --danger: #a3401f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }
  header {
    margin-bottom: 24px;
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 6px;
  }
  h1 {
    font-size: 26px;
    margin: 0 0 6px;
    line-height: 1.2;
  }
  p.sub {
    color: var(--muted);
    margin: 0;
    font-size: 14px;
    line-height: 1.5;
  }
  form {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-top: 20px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--ink);
  }
  textarea {
    width: 100%;
    min-height: 96px;
    resize: vertical;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    font-size: 15px;
    font-family: inherit;
    color: var(--ink);
    background: var(--paper);
  }
  textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  button {
    margin-top: 12px;
    width: 100%;
    padding: 13px 16px;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: 8px;
    line-height: 1.5;
  }
  .status {
    margin-top: 20px;
    font-size: 14px;
    color: var(--muted);
    display: none;
  }
  .status.active { display: flex; align-items: center; gap: 8px; }
  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .result {
    margin-top: 20px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    display: none;
    white-space: pre-wrap;
    font-size: 14.5px;
    line-height: 1.65;
  }
  .result.active { display: block; }
  .error {
    margin-top: 20px;
    background: #fbeee8;
    border: 1px solid #e6b8a2;
    color: var(--danger);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 14px;
    display: none;
    line-height: 1.5;
  }
  .error.active { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Trip planner</div>
    <h1>Where to next?</h1>
    <p class="sub">Describe your trip and the agent will research it and build a plan.</p>
  </header>

  <form id="trip-form">
    <label for="message">Tell it about your trip</label>
    <textarea id="message" placeholder="e.g. Plan a 3-day trip to Goa for a couple who like beaches and good food"></textarea>
    <button type="submit" id="submit-btn">Plan my trip</button>
    <div class="hint">First request can take up to a minute while the server wakes up.</div>
  </form>

  <div class="status" id="status">
    <div class="spinner" aria-hidden="true"></div>
    <span id="status-text">Waking up the agent…</span>
  </div>

  <div class="error" id="error"></div>

  <div class="result" id="result"></div>
</div>

<script>
const API_URL = "https://travel-agent-poc-z9i8.onrender.com/plan-trip";

const form = document.getElementById("trip-form");
const messageEl = document.getElementById("message");
const submitBtn = document.getElementById("submit-btn");
const statusEl = document.getElementById("status");
const statusText = document.getElementById("status-text");
const errorEl = document.getElementById("error");
const resultEl = document.getElementById("result");

form.addEventListener("submit", async function (e) {
  e.preventDefault();

  const message = messageEl.value.trim();
  if (!message) {
    errorEl.textContent = "Enter a trip description first.";
    errorEl.classList.add("active");
    return;
  }

  errorEl.classList.remove("active");
  resultEl.classList.remove("active");
  submitBtn.disabled = true;
  statusEl.classList.add("active");
  statusText.textContent = "Waking up the agent…";

  const slowNotice = setTimeout(function () {
    statusText.textContent = "Still researching, this can take a minute…";
  }, 15000);

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: message })
    });

    if (!response.ok) {
      throw new Error("Server responded with status " + response.status);
    }

    const data = await response.json();
    resultEl.textContent = data.reply || "No reply received.";
    resultEl.classList.add("active");
  } catch (err) {
    errorEl.textContent = "Could not reach the trip planner. " + err.message;
    errorEl.classList.add("active");
  } finally {
    clearTimeout(slowNotice);
    statusEl.classList.remove("active");
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
